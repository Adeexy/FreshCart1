name: CD - Build, Scan, and Multi-Environment Deploy

on:
  push:
    branches: [main]
    paths:
      - 'checkout-api/**'
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  REPOSITORY: ${{ vars.GAR_REPOSITORY }}
  IMAGE_NAME: checkout-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-scan:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Docker to Artifact Registry
        run: |
          gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Define Image URI
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${REPOSITORY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Build Docker Image
        run: |
          docker build \
            -t "$IMAGE_URI" \
            -f ./checkout-api/Dockerfile \
            ./checkout-api

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Push Verified Image to Artifact Registry
        run: |
          echo "Trivy scan passed."
          docker push "$IMAGE_URI"

  deploy-staging:
    name: Deploy to Staging VM
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Update Staging VM Image
        env:
          IMAGE_URI: ${{ needs.build-and-scan.outputs.image_uri }}
        run: |
          gcloud compute instances add-metadata staging-checkout-api \
            --zone=us-central1-a \
            --project="${GCP_PROJECT_ID}" \
            --metadata="freshcart-image=${IMAGE_URI}"

      - name: Restart Staging VM
        run: |
          gcloud compute instances reset staging-checkout-api \
            --zone=us-central1-a \
            --project="${GCP_PROJECT_ID}"

      - name: Verify Staging
        run: |
          LB_IP=$(gcloud compute addresses describe staging-checkout-api-ip \
            --global \
            --project="${GCP_PROJECT_ID}" \
            --format="value(address)")

          echo "Staging Load Balancer: http://${LB_IP}"

          for i in {1..30}; do
            if curl -fsS --max-time 5 "http://${LB_IP}/" >/dev/null; then
              echo "Staging is healthy."
              exit 0
            fi

            echo "Staging not ready yet. Attempt $i/30..."
            sleep 10
          done

          echo "Staging failed health verification."
          exit 1

  deploy-production:
    name: Deploy to Production
    needs: [build-and-scan, deploy-staging]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Promote Same Image to Production
        env:
          IMAGE_URI: ${{ needs.build-and-scan.outputs.image_uri }}
        run: |
          echo "Promoting exact image tested in staging:"
          echo "$IMAGE_URI"

          gcloud compute instances add-metadata production-checkout-api \
            --zone=us-central1-a \
            --project="${GCP_PROJECT_ID}" \
            --metadata="freshcart-image=${IMAGE_URI}"

      - name: Restart Production VM
        run: |
          gcloud compute instances reset production-checkout-api \
            --zone=us-central1-a \
            --project="${GCP_PROJECT_ID}"

      - name: Verify Production
        run: |
          LB_IP=$(gcloud compute addresses describe production-checkout-api-ip \
            --global \
            --project="${GCP_PROJECT_ID}" \
            --format="value(address)")

          echo "Production Load Balancer: http://${LB_IP}"

          for i in {1..30}; do
            if curl -fsS --max-time 5 "http://${LB_IP}/" >/dev/null; then
              echo "Production is healthy."
              exit 0
            fi

            echo "Production not ready yet. Attempt $i/30..."
            sleep 10
          done

          echo "Production failed health verification."
          exit 1
